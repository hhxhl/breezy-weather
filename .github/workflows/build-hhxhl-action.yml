name: Build Breezy Weather

on:
  workflow_dispatch:
    inputs:
      upload_name:
        description: 'Artifact name'
        required: false
        default: 'breezy-weather'
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
    paths:
      - '**'
      - '.github/workflows/build-breezy.yml'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      BUILD_TOOLS_VERSION: '36.0.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean
        run: ./gradlew clean

      - name: Assemble basic release
        run: ./gradlew assembleBasicRelease

      - name: Sign APKs
        if: github.event_name != 'pull_request'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/basic/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          for apk in app/build/outputs/apk/basic/release/*-signed.apk; do
            cp "$apk" "artifacts/$(basename "$apk")"
          done
          for apk in app/build/outputs/apk/basic/release/*.apk; do
            case "$apk" in
              *-signed.apk) ;;
              *) cp "$apk" "artifacts/$(basename "$apk")" ;;
            esac
          done
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.upload_name || 'breezy-weather' }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 10
