name: Build Hhxhl Weather

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'hhxhl-main'
      upload_name:
        description: 'Artifact name'
        required: false
        default: 'hhxhl-weather'

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      BUILD_TOOLS_VERSION: 36.0.0

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean
        run: ./gradlew clean

      - name: Assemble basic release
        run: ./gradlew assembleBasicRelease

      - name: Sign APKs
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/basic/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Collect signed APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob

          signed_apks=(app/build/outputs/apk/basic/release/*-signed.apk)

          if [ ${#signed_apks[@]} -eq 0 ]; then
            echo "ERROR: No signed APK found!"
            ls -lah app/build/outputs/apk/basic/release || true
            exit 1
          fi

          cp "${signed_apks[@]}" artifacts/
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.upload_name }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 10